name: stock-watch

on:
  schedule:
    # Private repos bill each run as a full minute against 2000 min/month;
    # */30 stays under. Public repos are unmetered and can use */15.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash ./scripts/check-stock.sh

      - if: steps.check.outputs.changed == 'true'
        env:
          PREV: ${{ steps.check.outputs.prev }}
          CURR: ${{ steps.check.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.txt
          git commit -m "stock: ${PREV:-none} -> ${CURR}"
          git push
