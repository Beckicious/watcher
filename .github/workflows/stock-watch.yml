name: stock-watch

on:
  schedule:
    # Offset off :00/:15/:30/:45, which are the most contended minutes and the
    # likeliest to have their occurrence dropped rather than delayed.
    - cron: '2-59/5 * * * *'
    # Daily liveness ping so silence is distinguishable from a dead watcher.
    - cron: '5 6 * * *'
  workflow_dispatch:
    inputs:
      heartbeat:
        description: 'Send a liveness ping even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEARTBEAT: ${{ (github.event.schedule == '5 6 * * *' || inputs.heartbeat) && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/check-stock.sh

      - if: steps.check.outputs.changed == 'true'
        env:
          CHANGES: ${{ steps.check.outputs.changes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "stock: ${CHANGES}"
          git push

      - if: steps.check.outputs.all_expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS --max-time 20 --retry 2 \
            -H "Title: Stock watcher retired" \
            -H "Priority: default" \
            -H "Tags: wave" \
            -d "Every watch in watches.json is past its deadline. Scheduled runs are now disabled. To resume, bump the deadlines then: gh workflow enable stock-watch keepalive" \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null
          gh workflow disable stock-watch --repo "$GITHUB_REPOSITORY"
          gh workflow disable keepalive --repo "$GITHUB_REPOSITORY"
