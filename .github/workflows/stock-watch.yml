name: stock-watch

on:
  schedule:
    # TEMPORARY: */5 is GitHub's floor, for confirming the scheduler fires.
    # Revert to */30 once verified: on a private repo each run bills a full
    # minute against 2000 min/month, so */5 exhausts the quota in ~7 days.
    - cron: '*/5 * * * *'
    # Daily liveness ping so silence is distinguishable from a dead watcher.
    - cron: '5 6 * * *'
  workflow_dispatch:
    inputs:
      heartbeat:
        description: 'Send a liveness ping even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEARTBEAT: ${{ (github.event.schedule == '5 6 * * *' || inputs.heartbeat) && '1' || '' }}
        run: bash ./scripts/check-stock.sh

      - if: steps.check.outputs.changed == 'true'
        env:
          PREV: ${{ steps.check.outputs.prev }}
          CURR: ${{ steps.check.outputs.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.txt
          git commit -m "stock: ${PREV:-none} -> ${CURR}"
          git push
